name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: |
          python models/crew_water_loop.py
          python models/lunar_settlement_water.py
          python models/water_delivery_gear_ratio.py
      - run: |
          pip install .
          cd /tmp && python -c "import crew_water_loop, lunar_settlement_water, water_delivery_gear_ratio"
